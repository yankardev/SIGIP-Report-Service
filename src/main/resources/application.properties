spring.application.name=report-service
server.port=${PORT:9009}

# --- Seguridad ---
sigip.jwt.secret=${JWT_SECRET:+a7Bb1goFtCSc7TUMrL2S2TJ2hzXRJHb68VnOinThc4=}

# --- Feign hacia sales-service e inventory-service: tiempos límite + circuit breaker ---
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
resilience4j.timelimiter.configs.default.timeout-duration=4s

# --- Descubrimiento y monitoreo ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:9001/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
